services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: tarefas-oracle
    environment:
      ORACLE_PASSWORD: Oracle123
      APP_USER: tarefas
      APP_USER_PASSWORD: tarefas
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  backend:
    build: ./backend
    container_name: tarefas-backend
    environment:
      ORACLE_HOST: oracle
      ORACLE_PORT: 1521
      ORACLE_SERVICE: XEPDB1
      ORACLE_USER: tarefas
      ORACLE_PASSWORD: tarefas
    ports:
      - "8080:8080"
    depends_on:
      oracle:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: tarefas-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  oracle-data:
